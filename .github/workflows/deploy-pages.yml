name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/web/**"
      - "data/processed/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependency
        run: pip install pandas

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production site
        run: npm run build:web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test public URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Checking $PAGE_URL"
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$PAGE_URL" > /tmp/index.html
          grep -q "Ehime Restaurant License Map" /tmp/index.html
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "${PAGE_URL}data/manifest.json" > /tmp/manifest.json
          python - <<'PY'
          import json
          with open("/tmp/manifest.json", encoding="utf-8") as f:
              m = json.load(f)
          assert m["schema_version"] == 2
          assert len(m["exact_months_by_authority"]["松山市"]) == 23
          assert len(m["matsuyama_retrospective_months"]) == 39
          assert len(m["matsuyama_hybrid_months"]) == 62
          assert len(m["rolling12_end_months_matsuyama"]) == 12
          assert m["strict_new_event_count"] >= 800
          assert m["retrospective_visible_event_count"] >= 3500
          print("Public Pages data QA: PASS")
          PY
