name: Probe historical source availability

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Probe historical sources
        run: python src/research/probe_history.py
      - name: Commit probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/HISTORY_PROBE.json
          if git diff --cached --quiet; then
            echo "No probe changes"
          else
            git commit -m "research: refresh historical source probe"
            git push
          fi
