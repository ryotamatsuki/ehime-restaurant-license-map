name: Audit Matsuyama retrospective history

on:
  push:
    branches: [main]
    paths:
      - "src/retrospective/**"
      - ".github/workflows/audit-retrospective.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python src/retrospective/audit_matsuyama_retrospective.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/MATSUYAMA_RETROSPECTIVE_AUDIT.json
          git commit -m "research: audit Matsuyama retrospective history" || exit 0
          git pull --rebase origin main
          git push
