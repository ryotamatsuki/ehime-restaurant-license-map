name: Build permit event panel

on:
  push:
    branches: [main]
    paths:
      - "data/snapshots/**"
      - "src/transform/**"
      - ".github/workflows/build-event-panel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas
      - name: Build event panel
        run: python src/transform/build_event_panel.py
      - name: Commit processed panel and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed docs/research/STAGE3_CURRENT_PANEL_AUDIT.json
          if git diff --cached --quiet; then
            echo "No processed changes"
          else
            git commit -m "data: rebuild current permit event panel"
            git push
          fi
