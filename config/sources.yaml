version: 2
sources:
  ehime_prefecture:
    authority: "愛媛県"
    coverage: "愛媛県内（松山市を除く）"
    landing_url: "https://www.pref.ehime.jp/opendata-catalog/dataset/2344.html"
    metadata_api: "https://www.pref.ehime.jp/opendata-catalog/api/package_show?id=44d962fa-8684-4be1-9437-030298a483f3"
    update_frequency: "monthly"
    license: "CC BY"
    first_publication_note: "県案内ページでは令和4年1月（令和3年12月新規分）から掲載と説明"
    caveats:
      - "休止中又は廃業している施設が含まれる場合がある"
      - "申請時期等により最新情報が反映されない場合がある"
      - "一部情報を掲載していない場合がある"
      - "2026-08-18〜2026-08-20公開版に誤掲載事案。使用禁止。"
  matsuyama_monthly:
    authority: "松山市"
    coverage: "松山市"
    landing_url: "https://www.city.matsuyama.ehime.jp/shisei/opendata/metadata/shokuhinsinki.html"
    update_frequency: "monthly"
    retention_note: "新規又は更新施設を毎月更新（過去1年分）"
    license: "CC BY"
    audited_notes:
      - "所在地＿連結表記は現行月次12シートで欠損0"
      - "緯度・経度の列は存在するが現行取得データでは値が空"
      - "申請区分の列は存在するが現行取得データでは値が空"
      - "新規/更新の判別は初回許可年月日と許可年月日の比較を候補とする"
  matsuyama_all:
    authority: "松山市"
    coverage: "松山市"
    landing_url: "https://www.city.matsuyama.ehime.jp/shisei/opendata/metadata/shokuhin.html"
    update_frequency: "annual"
    license: "CC BY"
    audited_notes:
      - "令和3年5月末以前と令和3年6月以降の2ファイルに分割"
      - "許可番号は年度等を跨いで単独では一意でないため、行IDには使用しない"
privacy:
  commit_allowlist:
    - source_authority
    - source_snapshot_date
    - permit_number
    - initial_permit_date
    - permit_date
    - permit_expiry_date
    - business_type
    - facility_name
    - facility_address
    - municipality_code
    - town_id
    - latitude
    - longitude
    - application_type
    - record_scope
    - source_url
    - source_sha256
  never_commit:
    - applicant_name
    - applicant_kana
    - applicant_address
    - applicant_personal_name
    - corporate_representative_name
    - phone_number
    - email_address
